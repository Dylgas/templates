<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Your Library">
<style>
 .k{font:700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:4px;fill:#86efac}
 .t{font:900 76px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-3px}
 .cmd{font:500 22px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#e2e8f0}
 .gl{font:700 16px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#6ee7b7;opacity:.7}
 .spin{transform-origin:960px 150px;animation:spin 26s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
 .in{animation:in 1s cubic-bezier(.2,.8,.2,1) both} .in2{animation:in 1s .15s cubic-bezier(.2,.8,.2,1) both}
 @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<defs>

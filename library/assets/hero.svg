 <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" x2="700" y1="0" y2="0">
  <stop offset="0" stop-color="#6ee7b7"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-250 0;250 0;-250 0" dur="7s" repeatCount="indefinite"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#10b981" stop-opacity=".5"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
 <clipPath id="box"><rect x="48" y="196" width="500" height="44" rx="8"/></clipPath>
 <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

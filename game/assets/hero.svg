<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Your Game">
<style>
 .k{font:800 14px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:5px;fill:#fde68a}
 .t{font:900 90px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-2px;paint-order:stroke;stroke:#000;stroke-width:6px}
 .s{font:600 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#fde68a}
 .btn{font:800 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1a1206}
 .pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both} .pop2{animation:pop .7s .2s cubic-bezier(.2,1.4,.4,1) both}
 @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
 .press{animation:pr 1.2s ease-in-out infinite} @keyframes pr{50%{transform:scale(1.05)}}
</style>
<defs>
 <clipPath id="c"><rect width="1200" height="320" rx="22"/></clipPath>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1065"/><stop offset=".5" stop-color="#4c1d95"/><stop offset="1" stop-color="#831843"/></linearGradient>
 <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
 <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
